plugins {
    id 'fabric-loom' version "${project.loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "proximichat" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// NOTE: Minecraft 26.1+ ships unobfuscated (real Mojang parameter names),
// and Fabric Loom no longer remaps Minecraft or mods for these versions.
// That means: no `mappings(...)` block, plain `implementation` instead of
// `modImplementation`, and no more `remapJar` task.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}
